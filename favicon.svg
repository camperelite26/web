<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Mountain Silhouette Background -->
  <path d="M 60 360 L 190 190 L 290 320 L 370 230 L 450 360 Z" fill="url(#orangeGrad)" opacity="0.3" />

  <!-- Mountain Silhouette Foreground -->
  <path d="M 120 360 L 230 220 L 330 360 Z" fill="url(#orangeGrad)" opacity="0.8" />

  <!-- Camper Body -->
  <rect x="110" y="270" width="292" height="115" rx="22" fill="#FFFFFF" />
  
  <!-- Pop-top roof accent -->
  <path d="M 140 270 L 200 210 L 340 270 Z" fill="url(#blueGrad)" />

  <!-- Windshield and Windows -->
  <path d="M 310 285 H 380 C 388 285 393 292 391 300 L 382 325 H 310 V 285 Z" fill="url(#blueGrad)" />
  <rect x="225" y="285" width="70" height="40" rx="6" fill="url(#blueGrad)" />
  <rect x="140" y="285" width="70" height="40" rx="6" fill="url(#blueGrad)" />

  <!-- Side Stripe Accent -->
  <rect x="110" y="340" width="292" height="12" fill="url(#orangeGrad)" />

  <!-- Wheels -->
  <circle cx="185" cy="385" r="32" fill="#0F172A" />
  <circle cx="185" cy="385" r="16" fill="#E2E8F0" />
  <circle cx="335" cy="385" r="32" fill="#0F172A" />
  <circle cx="335" cy="385" r="16" fill="#E2E8F0" />
  
  <!-- Headlight -->
  <rect x="392" y="330" width="10" height="18" rx="4" fill="#FFC107" />
</svg>
